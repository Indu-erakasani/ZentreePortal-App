# /home/indhu/zentreeportal/pytest.ini
[pytest]
testpaths        = TestCases
python_files     = test_*.py
python_classes   = Test*
python_functions = test_*
addopts          = -v --tb=short
asyncio_mode     = auto
collect_ignore_glob = **/locust_*.py